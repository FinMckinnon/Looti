name: Update TOC Interface versions

on:
  schedule:
    - cron: 0 12 * * *
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One flavor per client, in the updater's names. The Interface line is written in this order.
      # classic_era is not a valid name: it matches "classic" and returns the MoP version.
      - name: Update TOC Interface versions
        uses: p3lim/toc-interface-updater@v4
        with:
          flavor: |
            retail
            vanilla
            mists
            wrath
            tbc
            forever

      # Six numeric versions, one per client (first two digits unique), or no pull request.
      - name: Check Interface line
        run: |
          versions=$(grep -m1 '^## Interface:' Looti.toc | cut -d: -f2 | tr -d ' ' | tr ',' '\n')
          echo "$versions"
          [ "$(grep -cE '^[0-9]{5,6}$' <<< "$versions")" -eq 6 ]
          [ "$(cut -c1-2 <<< "$versions" | sort -u | wc -l)" -eq 6 ]

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          title: Update Interface versions
          commit-message: Update Interface versions
          branch: update/interface
          delete-branch: true
